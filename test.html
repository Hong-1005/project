<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8"> <!-- 設定字符編碼 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 設定視口以支援響應式設計 -->
  <title>跑馬燈式輪播</title> <!-- 頁面標題 -->
  <link rel="stylesheet" href="css/test.css"> <!-- 連結CSS樣式表 -->
</head>

<body>
  <div class="carousel-container"> <!-- 輪播牆的外層容器 -->
    <div class="carousel-wrapper"> <!-- 輪播的包裝容器，用於處理無縫滾動 -->
      <div class="carousel-track"> <!-- 輪播項目的軌道容器 -->
        <!-- 輪播項目1 -->
        <div class="carousel-item">
          
        </div>

        <!-- 輪播項目2 -->
        <div class="carousel-item">
          <img src="img/about-commed1.jpg" alt="輪播圖片2">
          <div class="carousel-caption">項目2</div>
        </div>

        <!-- 輪播項目3 -->
        <div class="carousel-item">
          <img src="img/about-commed1.jpg" alt="輪播圖片3">
          <div class="carousel-caption">項目3</div>
        </div>

        <!-- 輪播項目4 -->
        <div class="carousel-item">
          <img src="img/about-commed1.jpg" alt="輪播圖片4">
          <div class="carousel-caption">項目4</div>
        </div>

        <!-- 複製的輪播項目（用於無縫循環效果） -->
        <div class="carousel-item">
          <img src="img/about-commed1.jpg" alt="輪播圖片1">
          <div class="carousel-caption">項目1</div>
        </div>

        <div class="carousel-item">
          <img src="img/about-commed1.jpg" alt="輪播圖片2">
          <div class="carousel-caption">項目2</div>
        </div>

        <div class="carousel-item">
          <img src="img/about-commed1.jpg" alt="輪播圖片3">
          <div class="carousel-caption">項目3</div>
        </div>

        <div class="carousel-item">
          <img src="img/about-commed1.jpg" alt="輪播圖片4">
          <div class="carousel-caption">項目4</div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/test.js"></script> <!-- 連結JavaScript腳本 -->
</body>

</html>
